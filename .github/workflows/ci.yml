name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # Version und SHA-256 von https://github.com/gitleaks/gitleaks/releases (Checksum-Datei geprüft).
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks:
    name: Secret-Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks installieren (Checksumme geprüft)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar xzf gitleaks.tgz gitleaks
      - name: Gesamte Git-Historie scannen
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1

  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    services:
      # Wegwerf-Datenbank nur für diesen Lauf (gleiche Hauptversion wie Neon), per Digest gepinnt
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST_ADMIN: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bekannte Schwachstellen (hoch/kritisch) blockieren
        run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Datenbanktests (RLS, Zugriffskontrolle, Auth)
        run: pnpm test:db
      - run: pnpm build
      # Hinweis: .next/ wird bewusst NICHT als Artefakt hochgeladen (enthält Preview-Keys,
      # Artefakte öffentlicher Repos sind öffentlich).
      - name: Playwright-Browser installieren
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (Anmeldung, 2FA, Depots, Zugriff, Security-Header, CSP)
        run: pnpm exec playwright test
      # Dynamischer Scan vor dem Merge: derselbe Produktions-Build mit frischer DB und
      # Testkursen. Kein Vercel-Bypass-Secret nötig; kein Report-Upload (Artefakte
      # öffentlicher Repos sind öffentlich). FAIL-Regeln in .zap/rules.tsv brechen den Lauf ab.
      - name: OWASP ZAP Baseline (Produktions-Build lokal)
        env:
          DATABASE_URL: postgres://rt100k_app:app@127.0.0.1:5432/rt100k_e2e
          BETTER_AUTH_URL: http://localhost:3200
          RT100K_QUOTES: fixture
        run: |
          BETTER_AUTH_SECRET="$(openssl rand -base64 32)" CRON_SECRET="$(openssl rand -base64 32)" \
            sh -c 'node scripts/e2e-db.ts && exec pnpm start --port 3200' > zap-server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3200/anmelden && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:3200/anmelden || { cat zap-server.log; exit 1; }
          # Image per Digest gepinnt (zaproxy 2.17.0); der Container braucht Schreibrechte in .zap
          chmod a+rwx .zap
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
            zap-baseline.py -t http://localhost:3200 -c rules.tsv -I

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Nur Open-Source-Lizenzen (Brief: ausschließlich OSS-Abhängigkeiten).
          # Nur gültige SPDX-IDs (sonst bricht die Action ab); „Commons Clause“ ist kein SPDX-Bezeichner.
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1, Elastic-2.0
