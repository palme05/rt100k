name: OWASP ZAP Baseline

# Läuft gegen jeden erfolgreichen Vercel-Preview-Deploy.
# Vercel meldet Deploys per repository_dispatch (nicht als GitHub-Deployment); das
# Event startet nur Workflows, die auf dem Default-Branch liegen.
# Voraussetzung: GitHub-Secret VERCEL_AUTOMATION_BYPASS_SECRET
# (Vercel → Project → Settings → Deployment Protection → Protection Bypass for Automation).
on:
  repository_dispatch:
    types: [vercel.deployment.success]

permissions:
  contents: read

jobs:
  zap:
    if: github.event.client_payload.environment != 'production'
    runs-on: ubuntu-latest
    env:
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      TARGET: ${{ github.event.client_payload.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Secret vorhanden, Ziel ist ein rt100k-Preview?
        id: guard
        run: |
          # Der Bypass-Schlüssel darf nur an eigene Vercel-Previews gehen
          case "$TARGET" in http*) ;; *) TARGET="https://$TARGET" ;; esac
          if [ -z "$BYPASS" ]; then
            echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET fehlt – ZAP-Scan übersprungen."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif ! printf '%s' "$TARGET" | grep -Eq '^https://rt100k-[a-z0-9-]+-palme00\.vercel\.app/?$'; then
            echo "::error::Unerwartetes Ziel – ZAP-Scan abgebrochen."
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          fi
      - name: ZAP Baseline-Scan
        if: steps.guard.outputs.run == 'true'
        env:
          ZAP_TARGET: ${{ steps.guard.outputs.target }}
        # Image per Digest gepinnt (zaproxy 2.17.0).
        # Kein Report-Upload: Artefakte öffentlicher Repos sind öffentlich.
        run: |
          # Der ZAP-Container läuft als eigener User und braucht Schreibrechte im Arbeitsordner.
          chmod a+rwx .zap
          docker run --rm -v "$PWD/.zap:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
            zap-baseline.py -t "$ZAP_TARGET" -c rules.tsv -I -j \
            -z "-config replacer.full_list(0).description=vercel-bypass \
                -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER \
                -config replacer.full_list(0).matchstr=x-vercel-protection-bypass \
                -config replacer.full_list(0).regex=false \
                -config replacer.full_list(0).replacement=$BYPASS"
