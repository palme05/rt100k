version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Neue Versionen erst nach 7 Tagen vorschlagen (wie minimumReleaseAge in pnpm-workspace.yaml).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # Typen passend zur Laufzeit (Node 22) – Major-Sprünge erst mit Node-Upgrade.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
